################################################################################
# Terraform Plan — IaC Validation & Security Scan
#
# This workflow runs on every PR that modifies Terraform files.
# It does NOT apply changes — only validates and shows what WOULD change.
#
# Steps:
# 1. Checkout code
# 2. Setup Terraform CLI
# 3. terraform init (download providers)
# 4. terraform fmt (check formatting)
# 5. terraform validate (check syntax)
# 6. Checkov scan (IaC security scanner — catches misconfigurations)
# 7. terraform plan (show what would change)
# 8. Post plan output as PR comment (reviewers can see changes)
#
# WHY PLAN IN CI?
# - Reviewers see EXACTLY what infrastructure changes a PR introduces
# - Catches errors before they reach production
# - Checkov catches security issues (open SGs, unencrypted resources)
# - No surprises during apply
################################################################################

name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
    branches:
      - main

env:
  TF_VERSION: "1.5.7"
  AWS_REGION: "us-east-1"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          quiet: true
          soft_fail: true
          output_format: cli

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan Results
            \`\`\`
            ${{ steps.plan.outputs.stdout || 'Plan succeeded' }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
