################################################################################
# Horizontal Pod Autoscaler (HPA)
#
# WHAT IT DOES:
# Automatically scales the number of pods up/down based on CPU/memory usage.
# More traffic → CPU rises → HPA adds more pods → load distributed.
#
# WHY AUTOSCALING?
# - Handles traffic spikes without manual intervention
# - Scales down during quiet periods (saves resources for other workloads)
# - Replaces "over-provisioning just in case" with dynamic right-sizing
#
# HOW IT WORKS:
# 1. Metrics Server reports current CPU/memory per pod
# 2. HPA compares against target (70% CPU)
# 3. If above target → scale up (add pods)
# 4. If below target → scale down (remove pods)
# 5. Respects min/max bounds (never below 2, never above 6)
################################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rockauto-demo-app
  namespace: rockauto-apps
  labels:
    app: demo-app
    team: platform
    environment: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rockauto-demo-app
  minReplicas: 2   # Never go below 2 (HA across AZs)
  maxReplicas: 6   # Never exceed 6 (cost ceiling)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale up when average CPU exceeds 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale up when memory exceeds 80%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down (prevents flapping)
    scaleUp:
      stabilizationWindowSeconds: 60   # Scale up quickly (1 min)
