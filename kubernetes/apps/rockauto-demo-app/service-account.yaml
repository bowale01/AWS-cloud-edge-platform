################################################################################
# Service Account — Pod Identity
#
# WHAT IT DOES:
# Gives the demo-app pods a unique identity in the cluster.
# Combined with IRSA annotation, this identity maps to an AWS IAM role.
#
# WHY NOT USE "default" SERVICE ACCOUNT?
# - The default SA often has too many permissions
# - You can't apply IRSA (AWS IAM role) to the default SA safely
# - RBAC can't scope permissions per app if everything uses "default"
# - Security: one compromised app shouldn't have another app's permissions
#
# IRSA FLOW:
# Pod starts → K8s mounts a projected token → AWS STS verifies the token
# → Pod gets temporary AWS credentials for THIS role only
################################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rockauto-demo-app
  namespace: rockauto-apps
  labels:
    app: demo-app
    team: platform
    environment: prod
  annotations:
    # IRSA: this service account can assume this IAM role
    # The role grants only the permissions this specific app needs
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/rockauto-demo-app-role-prod"
