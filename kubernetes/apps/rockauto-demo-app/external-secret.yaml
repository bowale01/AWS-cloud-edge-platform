################################################################################
# ExternalSecret — Sync Secrets Manager → Kubernetes Secret
#
# WHAT IT DOES:
# Tells the External Secrets Operator to fetch specific keys from
# AWS Secrets Manager and create a native Kubernetes Secret.
#
# FLOW:
# 1. This ExternalSecret CR is applied to the cluster
# 2. ESO controller reads it and uses its IRSA role to call Secrets Manager
# 3. ESO fetches the secret value (e.g., DB_PASSWORD)
# 4. ESO creates/updates a K8s Secret named "rockauto-app-secrets"
# 5. The demo-app Deployment mounts this Secret via envFrom
# 6. App reads DB_PASSWORD as an environment variable
# 7. ESO refreshes every 1 hour (picks up rotated secrets automatically)
#
# SECURITY:
# - Secret value is NEVER in Git (only the reference is here)
# - ESO uses IRSA (no static credentials)
# - Secrets Manager encrypts with KMS
# - K8s Secret is encrypted at rest via EKS envelope encryption (KMS)
################################################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rockauto-app-secrets
  namespace: rockauto-apps
  labels:
    app: demo-app
    team: platform
    environment: prod
spec:
  refreshInterval: 1h  # Check for secret changes every hour

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rockauto-app-secrets  # K8s Secret name (referenced in Deployment)
    creationPolicy: Owner

  data:
    - secretKey: DB_PASSWORD     # Key name in the K8s Secret
      remoteRef:
        key: rockauto/app-secrets/prod  # AWS Secrets Manager secret name
        property: DB_PASSWORD            # JSON key within the secret

    - secretKey: API_KEY
      remoteRef:
        key: rockauto/app-secrets/prod
        property: API_KEY

    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: rockauto/app-secrets/prod
        property: MQTT_PASSWORD
---
################################################################################
# ClusterSecretStore — Tells ESO HOW to connect to Secrets Manager
# This is cluster-wide (shared by all namespaces).
################################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: rockauto-security
